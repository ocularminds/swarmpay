server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: swarm-pay-executor
  datasource:
    # A full JDBC URL, or the database's host:port (as Render's private network gives it).
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOSTPORT}/swarm}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
  flyway:
    locations: classpath:db/payments
    schemas: payments
    default-schema: payments
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
