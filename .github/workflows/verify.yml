name: Verify SwarmPay

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SWARM_AI_PROVIDER: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            infra/agentsafe/package-lock.json
      - name: Java invariants and PostgreSQL recovery tests
        run: ./gradlew verify --no-daemon --console=plain
      - name: Verify preflight, deployment configuration and release packaging without external services
        run: node --test demo/check-paypal.test.mjs infra/egress/proxy.test.mjs infra/venue/venue.test.mjs infra/identity/identity.test.mjs infra/azure/render.test.mjs infra/azure/prepare-secrets.test.mjs infra/azure/release.test.mjs
      - name: Build the web application
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build
          npm --prefix apps/web audit --audit-level=high
      - name: Verify the published authority boundary
        run: |
          npm --prefix infra/agentsafe ci
          npm --prefix infra/agentsafe test
          npm --prefix infra/agentsafe run verify-boundary
          npm --prefix infra/agentsafe audit --audit-level=high
      - name: Start an isolated synthetic demo
        run: |
          node demo/setup.mjs
          node demo/doctor.mjs
          docker compose up --build -d --wait --wait-timeout 240
      - name: Exercise REST, MCP, isolation and restart behavior
        run: |
          node demo/smoke.mjs
          npx --yes newman@6.2.1 run postman/SwarmPay-agent.postman_collection.json -e postman/SwarmPay-local.postman_environment.json
          node demo/check-isolation.mjs
          SWARM_WEBHOOK_PUBLIC_URL=http://127.0.0.1:5173 node demo/check-webhook-ingress.mjs
          node demo/check-restart.mjs
          docker compose exec -T agentsafe node node_modules/@decionis/agentsafe/dist/Cli.js verify chain /var/lib/agentsafe/evidence/evidence.jsonl
      - name: Install the test browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile journeys
        working-directory: apps/web
        run: npm run test:e2e
      - name: Verify hosted HTTPS sessions and payment isolation
        run: |
          node demo/hosted/run.mjs up
          node demo/hosted/run.mjs check
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/reports/tests/
            **/build/test-results/test/TEST-*.xml
            apps/web/test-results/
            apps/web/playwright-report/
      - name: Stop the test stack
        if: always()
        run: |
          node demo/hosted/run.mjs down
          docker compose down --remove-orphans
