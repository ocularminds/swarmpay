limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
resolver 127.0.0.11 valid=5s ipv6=off;
upstream commerce_backend {
    zone commerce_backend 64k;
    server commerce-app:8080 resolve;
}
upstream payment_backend {
    zone payment_backend 64k;
    server payment-executor:8081 resolve;
}
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /api/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://commerce_backend;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://commerce_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 150s;
        add_header Cache-Control no-store;
    }
    location = /mcp {
        proxy_pass http://commerce_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_set_header Host $host;
    }
    location ~ ^/paypal/webhooks/(tents|catering)$ {
        limit_except POST { deny all; }
        proxy_pass http://payment_backend/internal/webhooks/$1;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
    }
    location /internal/ { return 404; }
    location /_agentsafe/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
