# Generated by node infra/render/blueprint.mjs; edit that file, not this one.
# Deploys the simulated-payments SwarmPay to Render. See docs/render.md.
services:
  - type: web
    name: swarm-pay-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: SWARM_NGINX_RESOLVER
        value: auto
      - key: SWARM_TRUSTED_PROXY
        value: 0.0.0.0/0
      - key: SWARM_COMMERCE_UPSTREAM
        fromService:
          type: pserv
          name: swarm-pay-commerce
          property: hostport
      - key: SWARM_EXECUTOR_UPSTREAM
        fromService:
          type: pserv
          name: swarm-pay-executor
          property: hostport
      - key: SWARM_VENUE_UPSTREAM
        fromService:
          type: pserv
          name: swarm-pay-venue
          property: hostport
  - type: pserv
    name: swarm-pay-commerce
    runtime: docker
    dockerfilePath: ./infra/java.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: APP
        value: commerce-app
      - key: PORT
        value: "8080"
      - key: SWARM_MODE
        value: demo
      - key: SWARM_AUTHORITY
        value: local
      - key: DECIONIS_POLICY_VERSION
        value: swarm-pay-demo-v1
      - key: VENUE_ISSUER
        value: demo-venue-fixture
      - key: SWARM_AI_PROVIDER
        value: demo
      - key: SWARM_PUBLIC_ORIGIN
        sync: false
      - key: SWARM_SESSION_COOKIE_SECURE
        value: "true"
      - key: ORGANIZER_USERNAME
        value: organizer
      - key: ORGANIZER_PASSWORD
        sync: false
      - key: MCP_TOKEN
        generateValue: true
      - key: DATABASE_USER
        value: swarm_app
      - key: DATABASE_PASSWORD
        fromService:
          type: pserv
          name: swarm-pay-postgres
          envVarKey: PG_APP_PASSWORD
      - key: DATABASE_HOSTPORT
        fromService:
          type: pserv
          name: swarm-pay-postgres
          property: hostport
      - key: AGENTSAFE_HOSTPORT
        fromService:
          type: pserv
          name: swarm-pay-agentsafe
          property: hostport
      - key: EXECUTOR_TOKEN
        fromService:
          type: pserv
          name: swarm-pay-executor
          envVarKey: EXECUTOR_TOKEN
      - key: EGRESS_HOSTPORT
        fromService:
          type: pserv
          name: swarm-pay-egress
          property: hostport
      - key: VENUE_PUBLIC_KEY
        fromService:
          type: pserv
          name: swarm-pay-executor
          envVarKey: VENUE_PUBLIC_KEY
  - type: pserv
    name: swarm-pay-executor
    runtime: docker
    dockerfilePath: ./infra/java.Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: APP
        value: payment-executor
      - key: PORT
        value: "8081"
      - key: SWARM_MODE
        value: demo
      - key: SWARM_AUTHORITY
        value: local
      - key: DECIONIS_POLICY_VERSION
        value: swarm-pay-demo-v1
      - key: VENUE_ISSUER
        value: demo-venue-fixture
      - key: EXECUTOR_TOKEN
        generateValue: true
      - key: DATABASE_USER
        value: swarm_executor
      - key: DATABASE_PASSWORD
        fromService:
          type: pserv
          name: swarm-pay-postgres
          envVarKey: PG_EXECUTOR_PASSWORD
      - key: DATABASE_HOSTPORT
        fromService:
          type: pserv
          name: swarm-pay-postgres
          property: hostport
      - key: VENUE_PUBLIC_KEY
        sync: false
  - type: pserv
    name: swarm-pay-agentsafe
    runtime: docker
    dockerfilePath: ./infra/agentsafe/Dockerfile
    dockerContext: ./infra/agentsafe
    plan: starter
    disk:
      name: evidence
      mountPath: /var/lib/agentsafe/evidence
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8082"
      - key: AGENTSAFE_LISTEN
        value: 0.0.0.0:8082
      - key: SWARM_MODE
        value: demo
      - key: SWARM_AUTHORITY
        value: local
      - key: DECIONIS_POLICY_VERSION
        value: swarm-pay-demo-v1
      - key: VENUE_ISSUER
        value: demo-venue-fixture
      - key: AGENTSAFE_UPSTREAM_HOSTPORT
        fromService:
          type: pserv
          name: swarm-pay-executor
          property: hostport
  - type: pserv
    name: swarm-pay-venue
    runtime: docker
    dockerfilePath: ./infra/venue/Dockerfile
    dockerContext: ./infra/venue
    plan: starter
    envVars:
      - key: PORT
        value: "8084"
      - key: VENUE_ISSUER
        value: demo-venue-fixture
      - key: VENUE_PRIVATE_KEY
        sync: false
      - key: COMMERCE_HOSTPORT
        fromService:
          type: pserv
          name: swarm-pay-commerce
          property: hostport
  - type: pserv
    name: swarm-pay-egress
    runtime: docker
    dockerfilePath: ./infra/egress/Dockerfile
    dockerContext: ./infra/egress
    plan: starter
    envVars:
      - key: PORT
        value: "3128"
      - key: EGRESS_ALLOW_HOSTS
        value: api.trychannel3.com
  - type: pserv
    name: swarm-pay-postgres
    runtime: docker
    dockerfilePath: ./infra/render/postgres.Dockerfile
    dockerContext: .
    plan: starter
    disk:
      name: data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "5432"
      - key: POSTGRES_DB
        value: swarm
      - key: POSTGRES_USER
        value: postgres
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: PG_APP_PASSWORD
        generateValue: true
      - key: PG_EXECUTOR_PASSWORD
        generateValue: true
