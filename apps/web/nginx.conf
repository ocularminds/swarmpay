# Limits below are per client. Only the peer named here may state the client address: the local
# default names none, and the hosted network policy makes the ingress the web's only peer.
set_real_ip_from ${SWARM_TRUSTED_PROXY};
real_ip_header X-Forwarded-For;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;
map $request_method $planning_key { default ""; POST $binary_remote_addr; }
limit_req_zone $planning_key zone=planning:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=venue:10m rate=10r/m;
resolver ${SWARM_NGINX_RESOLVER} valid=5s ipv6=off;
upstream commerce_backend {
    zone commerce_backend 64k;
    server commerce-app:8080 resolve;
}
upstream payment_backend {
    zone payment_backend 64k;
    server payment-executor:8081 resolve;
}
upstream venue_backend {
    zone venue_backend 64k;
    server venue:8084 resolve;
}
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control no-store always;
    location = /api/login {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://commerce_backend;
        proxy_set_header Host $http_host;
    }
    # PayPal sign-in starts and returns here; the same per-client limit as password sign-in.
    location ~ ^/api/paypal/(start|return)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://commerce_backend;
        proxy_set_header Host $http_host;
    }
    location ~ ^/api/(intent|plans)$ {
        limit_req zone=planning burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://commerce_backend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 150s;
    }
    location /api/ {
        proxy_pass http://commerce_backend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 150s;
    }
    location = /mcp {
        proxy_pass http://commerce_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_set_header Host $http_host;
    }
    # The simulated venue's one public route: the organizer asks it to confirm a delivery.
    location = /venue/deliveries {
        limit_req zone=venue burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://venue_backend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 90s;
    }
    location /venue/ { return 404; }
    location ~ ^/webhooks/paypal/(tents|catering)$ {
        include /etc/nginx/snippets/webhook-proxy.conf;
    }
    location /webhooks/ { return 404; }
    location /paypal/webhooks/ { return 404; }
    location /internal/ { return 404; }
    location /_agentsafe/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}

# Dedicated upstream for the temporary ngrok tunnel. No organizer, MCP or
# internal payment-command routes are served on this listener.
server {
    listen 8083;
    server_tokens off;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location ~ ^/webhooks/paypal/(tents|catering)$ {
        include /etc/nginx/snippets/webhook-proxy.conf;
    }
    location / { return 404; }
}
