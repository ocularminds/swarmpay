services:
  postgres:
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /tmp:uid=999,gid=999,mode=1777
      - /var/run/postgresql:uid=999,gid=999,mode=0770
  payment-executor:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1777"]
  agentsafe:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=1777"]
  commerce-app:
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1777"]
  web:
    networks: [hosted-ingress]
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0770
      - /var/run:uid=101,gid=101,mode=0770
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0770
      - /tmp:uid=101,gid=101,mode=1777
  tls-fixture:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    ports: ["127.0.0.1:5443:8443"]
    volumes:
      - ./demo/hosted/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/hosted/tls.crt:/run/tls/certificate.pem:ro
      - ./.local/hosted/tls.key:/run/tls/private.key:ro
    networks: [hosted-ingress]
    depends_on: [web]
networks:
  hosted-ingress:
